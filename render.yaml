services:
  - type: web
    name: co-patner
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd apps/web && rm -rf node_modules && npm install && npm run build && cd ../server && rm -rf node_modules && npm install && npm run build
    startCommand: cd apps/server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://co-patner.onrender.com
      - key: CORS_ORIGINS
        value: https://co-patner.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@co-patner.com
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyB4tbxMiCr1571wkiQa8BH8-db0MwU3SNc
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: funcam-6c254.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: funcam-6c254
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: funcam-6c254.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "121518820033"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:121518820033:web:73993e03d669664f566240
