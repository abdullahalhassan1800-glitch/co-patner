services:
  - type: web
    name: co-patner-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        value: https://co-patner.vercel.app
      - key: CORS_ORIGINS
        value: https://co-patner.vercel.app,https://co-patner-backend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
