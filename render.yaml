services:
  - type: web
    name: co-patner
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd apps/web && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd apps/server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://co-patner.onrender.com
      - key: CORS_ORIGINS
        value: https://co-patner.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
